# Docker Compose untuk Deployment HTTP

services:
  # Service Nginx sebagai Reverse Proxy
  nginx:
    image: nginx:latest
    ports:
      - "8080:80" # Map port 8080 di host ke 80 di container
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  # Service untuk Backend
  backend:
    build:
      context: . # Konteks build sekarang adalah direktori backend
    # Port 3001 tidak perlu diekspos ke host, hanya perlu diakses oleh nginx
    depends_on:
      - mongo
    env_file:
      - ./.env

  # Service untuk Database (MongoDB)
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
