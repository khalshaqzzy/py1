server {
    listen 80;
    server_name cryptoalpha.site www.cryptoalpha.site;

    # Route for Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cryptoalpha.site www.cryptoalpha.site;

    # SSL Certificate paths
    ssl_certificate /etc/letsencrypt/live/cryptoalpha.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptoalpha.site/privkey.pem;

    # Include recommended TLS parameters
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}