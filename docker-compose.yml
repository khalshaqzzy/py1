# Docker Compose untuk Dev Py1
version: '3.8'

services:
  # Service untuk Backend
  backend:
    build:
      context: ./backend # Menggunakan Dockerfile di dalam folder backend
    ports:
      - "3001:3001" # Memetakan port 3001 di host ke port 3001 di container
    volumes:
      # Mount source code untuk live-reloading saat development
      - ./backend:/app
      # Volume anonim untuk node_modules agar tidak tertimpa oleh host
      - /app/node_modules
    depends_on:
      - mongo # Memastikan service mongo berjalan sebelum backend dimulai
    environment:
      # Variabel lingkungan yang akan digunakan oleh aplikasi
      - PORT=3001
      - DB_URI=mongodb://mongo:27017/py1
    # Menggunakan nodemon untuk auto-restart saat ada perubahan file
    # Perintah ini akan menimpa CMD di Dockerfile
    command: npx nodemon index.js

  # Service untuk Database (MongoDB)
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017" # Memetakan port default MongoDB
    volumes:
      # Named volume untuk menyimpan data MongoDB secara persisten
      - mongo-data:/data/db

# Mendefinisikan named volume yang digunakan oleh service mongo
volumes:
  mongo-data:
